name: Supabase keep-alive
# Free-tier Supabase projects auto-pause after 7 days without API activity.
# This ping every 2 days keeps the Ethoz project active; a failed run means
# the project is paused/unreachable and GitHub will email a failure alert.
on:
  schedule:
    - cron: '23 9 */2 * *' # every 2 days, 09:23 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "${{ secrets.PUBLIC_SUPABASE_URL }}/rest/v1/leads?select=id&limit=1" \
            -H "apikey: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}")
          echo "REST ping -> HTTP $code"
          case "$code" in
            2*) echo "Project active." ;;
            *) echo "::error::Supabase unreachable or paused (HTTP $code) — restore it in the dashboard: https://supabase.com/dashboard/project/hnhokvhecfysbqepypjb"; exit 1 ;;
          esac
