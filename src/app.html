<!doctype html>
<html lang="es" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<!-- Theme init — light warm professional (Launch UI aesthetic). -->
		<script>
		  document.documentElement.dataset.theme = 'light';
		</script>
		<!-- Consent Mode must run synchronously, before GTM or any measurement command. -->
		<script>
		  window.dataLayer = window.dataLayer || [];
		  window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
		  window.gtag('consent', 'default', {
		    analytics_storage: 'denied',
		    ad_storage: 'denied',
		    ad_user_data: 'denied',
		    ad_personalization: 'denied',
		    wait_for_update: 500
		  });

		  // Restore an explicit prior choice before hydration. Defaults above remain
		  // privacy-safe when storage is unavailable, malformed, or undecided.
		  try {
		    var savedConsent = JSON.parse(localStorage.getItem('ethoz_consent_v1') || 'null');
		    var internalVisitor = localStorage.getItem('ethoz_internal') === '1';
		    if (!internalVisitor && savedConsent && typeof savedConsent.updatedAt === 'number') {
		      window.gtag('consent', 'update', {
		        analytics_storage: savedConsent.analytics === true ? 'granted' : 'denied',
		        ad_storage: savedConsent.marketing === true ? 'granted' : 'denied',
		        ad_user_data: savedConsent.marketing === true ? 'granted' : 'denied',
		        ad_personalization: savedConsent.marketing === true ? 'granted' : 'denied'
		      });
		    }
		  } catch (_) {
		    // Storage can be unavailable in private browsing; denied remains active.
		  }
		  try {
		    // Events collected before consent were part of a legacy implementation.
		    sessionStorage.removeItem('ethoz_pending_events');
		  } catch (_) {
		    // Session storage can be unavailable independently of local storage.
		  }
		</script>
		<!-- First-party API preconnect. Trackers load only after consent. -->
		<link rel="preconnect" href="https://app.ethoz.cl" crossorigin />
		<!-- Body font from system stack via CSS tokens in app.css -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg?v=4" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon.png?v=4" />
		<link rel="apple-touch-icon" sizes="192x192" href="%sveltekit.assets%/apple-touch-icon.png?v=4" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Theme-color matches the Launch UI light warm canvas. -->
		<meta name="theme-color" content="#fafaf9" />
		<meta name="description" content="Protección escolar inteligente. Cumplimiento Ley 21.719, seguridad escolar y convivencia para colegios en Chile." />
		<meta property="og:image" content="https://ethoz.cl/images/og-default.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<link rel="llms" href="/llms.txt" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
