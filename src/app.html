<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<!-- Theme init — light only by product decision (2026-05-02).
		     Dark mode tokens + toggle exist in code but are not exposed to users.
		     Re-enable by reading localStorage('theme') / prefers-color-scheme. -->
		<script>
		  document.documentElement.dataset.theme = 'light';
		</script>
		<!-- dataLayer stub (GTM loader runs after consent from +layout.svelte) -->
		<script>
		  window.dataLayer = window.dataLayer || [];
		</script>
		<!-- First-party API preconnect. Trackers load only after consent. -->
		<link rel="preconnect" href="https://app.ethoz.cl" crossorigin />
		<!-- Display + body fonts (DM Sans / Inter / JetBrains Mono) bundled via @fontsource-variable in app.css -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg?v=4" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon.png?v=4" />
		<link rel="apple-touch-icon" sizes="192x192" href="%sveltekit.assets%/apple-touch-icon.png?v=4" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Theme-color matches the cream canvas (8020 spine, light by product decision). -->
		<meta name="theme-color" content="#faf8f5" />
		<meta name="description" content="Protección escolar inteligente. Cumplimiento Ley 21.719, seguridad escolar y convivencia para colegios en Chile." />
		<meta property="og:image" content="https://ethoz.cl/images/og-default.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<link rel="llms" href="/llms.txt" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
